name: Validate Template

on:
  pull_request:
    paths:
      - "templates/*.json"
      - "schema.json"
      - "index.json"
      - "scripts/*.py"
      - ".github/workflows/validate-template.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate templates
        run: python scripts/validate_template.py
