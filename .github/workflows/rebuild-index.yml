name: Rebuild Index

on:
  push:
    branches:
      - main
    paths:
      - "templates/*.json"
      - "scripts/rebuild_index.py"
      - ".github/workflows/rebuild-index.yml"
  workflow_dispatch:

jobs:
  rebuild-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild index
        run: python scripts/rebuild_index.py

      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild template index"
          git push
